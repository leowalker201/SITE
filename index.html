<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GistFlix</title>
    <style>
        :root {
            --primary-color: #e50914;
            --bg-color: #141414;
            --card-width: 200px;
            --card-height: 300px;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        header {
            padding: 20px 50px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
            position: fixed;
            width: 100%;
            z-index: 100;
        }

        .logo {
            color: var(--primary-color);
            font-size: 30px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .hero {
            height: 60vh;
            display: flex;
            align-items: center;
            padding: 0 50px;
            background: linear-gradient(to right, #141414 10%, transparent 90%), url('https://images.unsplash.com/photo-1574267432553-4b4628081c31?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
        }

        .main-container {
            padding: 20px 50px;
            margin-top: -100px;
        }

        .category-title {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--card-width), 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .movie-card {
            width: 100%;
            height: var(--card-height);
            background-color: #333;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.3s ease;
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        .movie-card:hover {
            transform: scale(1.05);
            z-index: 2;
        }

        .movie-info {
            position: absolute;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            width: 100%;
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
        }

        /* Player Modal */
        #player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 1000;
        }

        video { width: 100%; height: 100%; }

        .close-player {
            position: absolute;
            top: 20px; right: 30px;
            font-size: 40px; color: white;
            cursor: pointer; z-index: 1001;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">GistFlix</div>
    </header>

    <div class="hero">
        <div>
            <h1>Meus Filmes Gist</h1>
            <p>Sua biblioteca pessoal via GitHub Gist.</p>
        </div>
    </div>

    <div class="main-container">
        <h2 class="category-title">Catálogo</h2>
        <div id="movie-grid" class="movie-grid">
            <p id="loading">Carregando lista de filmes...</p>
        </div>
    </div>

    <div id="player-modal">
        <span class="close-player" onclick="closeVideo()">&times;</span>
        <video id="video-player" controls autoplay>
            Seu navegador não suporta vídeos.
        </video>
    </div>

    <script>
        // ==========================================================
        // CONFIGURAÇÃO: COLOQUE O LINK DO SEU GIST (RAW) AQUI
        // Exemplo: https://gist.githubusercontent.com/usuario/id/raw/lista.m3u
        // ==========================================================
        const GIST_URL = 'https://gist.githubusercontent.com/leowalker201/d51ba503dcfdfea80d85a1580f6819ab/raw/f750cfdb95580f6eff3eecdad003542f7ae441ea/gistfile1.txt';

        async function fetchMovies() {
            try {
                const response = await fetch(GIST_URL);
                const data = await response.text();
                parseM3U(data);
            } catch (error) {
                console.error("Erro ao carregar o Gist:", error);
                document.getElementById('loading').innerText = "Erro ao carregar filmes. Verifique o link do Gist.";
            }
        }

        function parseM3U(content) {
            const lines = content.split('\n');
            const movies = [];
            let currentMovie = {};

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    // Pega o nome do filme
                    const nameMatch = line.split(',')[1];
                    currentMovie.name = nameMatch ? nameMatch : "Filme sem nome";
                    
                    // Pega o sla oq da imagem (tvg-logo)
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    currentMovie.logo = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/200x300?text=Sem+Capa';
                } else if (line.startsWith('http')) {
                    currentMovie.url = line;
                    movies.push({ ...currentMovie });
                    currentMovie = {};
                }
            });

            renderMovies(movies);
        }

        function renderMovies(movies) {
            const grid = document.getElementById('movie-grid');
            grid.innerHTML = '';

            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.style.backgroundImage = `url('${movie.logo}')`;
                
                card.innerHTML = `
                    <div class="movie-info">
                        <strong>${movie.name}</strong>
                    </div>
                `;

                card.onclick = () => playVideo(movie.url);
                grid.appendChild(card);
            });
        }

        function playVideo(url) {
            const modal = document.getElementById('player-modal');
            const player = document.getElementById('video-player');
            player.src = url;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeVideo() {
            const modal = document.getElementById('player-modal');
            const player = document.getElementById('video-player');
            player.pause();
            player.src = "";
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Iniciar
        fetchMovies();
    </script>
</body>
</html>
